<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家居审美测试 · 你的理想之家</title>
<style>
:root{ --bg:#F5F1E8; --ink:#2E2B26; --accent:#C99A2C; --green:#6E7F52; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#E7E2D5;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;justify-content:center;min-height:100vh;overflow:hidden}
.stage{width:100%;max-width:430px;background:var(--bg);height:100vh;height:100dvh;
  display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{flex:1;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* 顶部题号进度 */
.topbar{flex:0 0 auto;padding:10px 16px 6px;display:flex;align-items:center;gap:12px}
.topbar .qn{font-size:12px;letter-spacing:.18em;color:var(--accent);font-family:Georgia,serif;white-space:nowrap}
.topbar .bar{flex:1;height:3px;background:#E8E1D0;border-radius:2px;overflow:hidden}
.topbar .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--accent));transition:width .3s ease}
.topbar .done{font-size:11px;color:var(--green);letter-spacing:.1em}

/* 图片展示区（含热区） */
.picwrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px 0}
.picwrap img.mainpic{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;
  box-shadow:0 4px 24px rgba(60,50,30,.12);user-select:none;-webkit-user-drag:none}
.zones{position:absolute;z-index:5}
.zone{position:absolute;cursor:pointer;border-radius:6px;transition:background .12s}
.zone:active{background:rgba(201,154,44,.14)}
.zone.sel{outline:3px solid var(--accent);outline-offset:-3px;background:rgba(201,154,44,.16)}
.zone .lab{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;
  background:rgba(46,43,38,.55);color:#fff;font-size:13px;font-family:Georgia,serif;
  display:none;align-items:center;justify-content:center}
.zone.sel .lab{display:flex}

/* 底部导航条（上一题/下一题） */
.navbar{flex:0 0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.72);
  border-top:1px solid #E4DCC8;backdrop-filter:blur(6px);display:flex;gap:10px;align-items:center}
.navbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 0;background:#fff;color:var(--ink);border:1.5px solid #D9D0BC;border-radius:8px;
  font-size:14px;letter-spacing:.12em;cursor:pointer;font-family:inherit;transition:transform .12s}
.navbtn:active{transform:scale(.96);border-color:var(--accent)}
.navbtn svg{width:16px;height:16px;flex:0 0 auto}
.navbtn.primary{background:var(--ink);color:#F6F1E4;border-color:var(--ink)}
.navhint{flex:0 0 auto;width:64px;text-align:center;font-size:11px;color:#8A8272;letter-spacing:.06em;line-height:1.5}

/* 启动页 */
.startbtns{flex:0 0 auto;padding:14px 30px calc(26px + env(safe-area-inset-bottom));background:rgba(255,255,255,.72);
  border-top:1px solid #E4DCC8;backdrop-filter:blur(6px)}
.btn-main{width:100%;padding:15px 0;background:var(--ink);color:#F6F1E4;font-size:16px;
  letter-spacing:.4em;text-indent:.4em;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
.btn-main:active{transform:scale(.98)}
.start-foot{margin-top:10px;text-align:center;font-size:10.5px;color:#A69D8C;letter-spacing:.14em}

/* 结果页轮播 */
.rhint{flex:0 0 auto;padding:8px 16px 2px;font-size:12px;color:#8A8272;text-align:center;letter-spacing:.08em}
.rhint b{color:var(--green);font-weight:normal}
.carousel{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:4px 8px}
.slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 4px 24px rgba(60,50,30,.12)}
.dots{flex:0 0 auto;display:flex;justify-content:center;gap:7px;padding:8px 0 4px}
.dots i{width:7px;height:7px;border-radius:50%;background:#D8CFBC;transition:all .2s}
.dots i.on{background:var(--accent);width:20px;border-radius:4px}
.arrow{position:absolute;top:50%;transform:translateY(-60%);z-index:8;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.9);border:1px solid #E0D8C4;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 2px 10px rgba(60,50,30,.15)}
.arrow:active{transform:translateY(-60%) scale(.92)}
.arrow svg{width:16px;height:16px}
.arrow.prev{left:8px}.arrow.next{right:8px}
.rbtns{flex:0 0 auto;display:flex;gap:10px;padding:8px 30px calc(18px + env(safe-area-inset-bottom));background:rgba(255,255,255,.72);border-top:1px solid #E4DCC8}
.btn-ghost{flex:1;padding:12px 0;background:#fff;border:1.5px solid var(--ink);border-radius:6px;
  font-size:14px;letter-spacing:.2em;text-indent:.2em;color:var(--ink);cursor:pointer;font-family:inherit}
.btn-solid{flex:1;padding:12px 0;background:var(--ink);border:1.5px solid var(--ink);border-radius:6px;
  font-size:14px;letter-spacing:.2em;text-indent:.2em;color:#F6F1E4;cursor:pointer;font-family:inherit}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:20;
  background:rgba(46,43,38,.88);color:#F6F1E4;font-size:13px;letter-spacing:.08em;
  padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="stage">

  <!-- 启动页 -->
  <div class="screen on" id="scr-start">
    <div class="picwrap"><img class="mainpic" src="h5img/cover.jpg" alt="封面"></div>
    <div class="startbtns">
      <button class="btn-main" id="btn-start">开 始 测 试</button>
      <div class="start-foot">趣味测试 · 仅供参考</div>
    </div>
  </div>

  <!-- 题目页 -->
  <div class="screen" id="scr-q">
    <div class="topbar">
      <span class="qn" id="q-num">1 / 10</span>
      <span class="bar"><i id="pbar"></i></span>
      <span class="done" id="q-done"></span>
    </div>
    <div class="picwrap">
      <img class="mainpic" id="q-img" src="h5img/q1.jpg" alt="题目">
      <div class="zones" id="zones"></div>
    </div>
    <div class="navbar">
      <button class="navbtn" id="nav-prev">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        上一题
      </button>
      <div class="navhint" id="nav-hint">点击图片<br>作答</div>
      <button class="navbtn primary" id="nav-next">
        下一题
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <!-- 结果引导页（10.png：测试结果） -->
  <div class="screen" id="scr-r0">
    <div class="picwrap"><img class="mainpic" src="h5img/r0.jpg" alt="测试结果"></div>
    <div class="startbtns">
      <button class="btn-main" id="btn-reveal">查 看 我 的 结 果</button>
      <div class="start-foot">你的家居审美人格 · 即将揭晓</div>
    </div>
  </div>

  <!-- 结果页 -->
  <div class="screen" id="scr-r">
    <div class="topbar">
      <span class="qn">YOUR RESULT</span>
      <span class="bar"><i style="width:100%"></i></span>
      <span class="done" id="r-which"></span>
    </div>
    <div class="rhint" id="r-hint">已定位到你的结果 · <b>左右滑动可看全部 6 种</b></div>
    <div style="flex:1;position:relative;overflow:hidden">
      <div class="carousel" id="carousel"></div>
      <div class="arrow prev" id="ar-prev"><svg viewBox="0 0 24 24" fill="none" stroke="#2E2B26" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
      <div class="arrow next" id="ar-next"><svg viewBox="0 0 24 24" fill="none" stroke="#2E2B26" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="rbtns">
      <button class="btn-ghost" onclick="location.reload()">再测一次</button>
      <button class="btn-solid" id="btn-save">截屏保存</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ═══════════ 数据区：题目图 / 布局 / 热区起点 ═══════════ */
/* layout: v=竖排四选(自上而下ABCD) / grid=田字格(左上A 右上B 左下C 右下D)
   top: 图片顶部标题区结束比例(热区从这开始) */
const QS = [
  {img:"h5img/q1.jpg", layout:"v",    top:0.283},
  {img:"h5img/q2.jpg", layout:"grid", top:0.280},
  {img:"h5img/q3.jpg", layout:"v",    top:0.283},
  {img:"h5img/q4.jpg", layout:"v",    top:0.287},
  {img:"h5img/q5.jpg", layout:"v",    top:0.287},
  {img:"h5img/q6.jpg", layout:"v",    top:0.283},
  {img:"h5img/q7.jpg", layout:"grid", top:0.283},
  {img:"h5img/q8.jpg", layout:"grid", top:0.287},
  {img:"h5img/q9.jpg", layout:"v",    top:0.373}
];
const NQ = 9;
const R0 = "h5img/r0.jpg";   /* 「测试结果」引导页 */
const RESULTS = ["h5img/r1.jpg","h5img/r2.jpg","h5img/r3.jpg","h5img/r4.jpg","h5img/r5.jpg","h5img/r6.jpg"];
const RNAME   = ["自然疗愈系","极简高级系","奶油浪漫系","中古故事系","艺术表达系","东方雅韵系"];
/* 判定：A自然(0) B极简(1) C奶油(2) D中古(3)；D≥4且B≥2且D>B→东方(5)；均匀→艺术(4) */
/* ═══════════ 数据区结束 ═══════════ */

const $ = id => document.getElementById(id);
let idx = 0, score = {A:0,B:0,C:0,D:0}, answered = new Array(NQ).fill(null);

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $(id).classList.add("on");
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove("show"), 1600);
}

$("btn-start").addEventListener("click", ()=>{
  idx = 0; score = {A:0,B:0,C:0,D:0}; answered = new Array(NQ).fill(null);
  renderQ(); show("scr-q");
});

/* ── 题目渲染 + 热区 ── */
function renderQ(){
  const q = QS[idx];
  $("q-num").textContent = (idx+1) + " / " + NQ;
  $("q-done").textContent = answered.filter(x=>x).length >= NQ ? "全部作答 ✓" : "";
  $("pbar").style.width = (answered.filter(x=>x).length / NQ * 100) + "%";
  const img = $("q-img");
  img.onload = ()=> layoutZones(q);
  img.src = q.img;
  if (img.complete) layoutZones(q);
  window.scrollTo(0,0);
}
function layoutZones(q){
  const img = $("q-img"), zones = $("zones"), r = img.getBoundingClientRect();
  zones.innerHTML = "";
  zones.style.left = (r.left - zones.parentElement.getBoundingClientRect().left) + "px";
  zones.style.top  = (r.top  - zones.parentElement.getBoundingClientRect().top) + "px";
  zones.style.width = r.width + "px"; zones.style.height = r.height + "px";
  const y0 = q.top * r.height, h = r.height - y0, w = r.width;
  const geo = q.layout === "v"
    ? [[0,y0,w,h/4],[0,y0+h/4,w,h/4],[0,y0+h/2,w,h/4],[0,y0+3*h/4,w,h/4]]           // 竖排 ABCD
    : [[0,y0,w/2,h/2],[w/2,y0,w/2,h/2],[0,y0+h/2,w/2,h/2],[w/2,y0+h/2,w/2,h/2]];      // 田字 ABCD
  geo.forEach((g,i)=>{
    const d = document.createElement("div");
    d.className = "zone" + (answered[idx] === "ABCD"[i] ? " sel" : "");
    d.style.cssText = `left:${g[0]}px;top:${g[1]}px;width:${g[2]}px;height:${g[3]}px`;
    d.innerHTML = `<span class="lab">${"ABCD"[i]}</span>`;
    d.addEventListener("click", ()=>pick(i, d));
    zones.appendChild(d);
  });
}
function pick(i, el){
  const k = "ABCD"[i];
  if (answered[idx] === k) return;                      // 重复点同一项
  if (answered[idx]) score[answered[idx]]--;            // 改答案：先撤销旧分
  answered[idx] = k; score[k]++;
  document.querySelectorAll(".zone").forEach(z=>z.classList.remove("sel"));
  el.classList.add("sel");
  toast(`已选 ${k} · ${["自然","极简","奶油","中古"][i]}`);
  setTimeout(()=>{
    const next = idx + 1;
    if (next < NQ){ idx = next; renderQ(); }
    else if (answered.every(x=>x)) finish();
    else { /* 停在最后一题等用户翻回去补答 */ }
  }, 480);
}
$("nav-prev").addEventListener("click", ()=>{ if (idx > 0){ idx--; renderQ(); } });
$("nav-next").addEventListener("click", ()=>{
  if (idx < NQ-1){ idx++; renderQ(); }
  else if (answered.every(x=>x)) finish();
  else toast("还有题目未作答，请翻回去补答");
});
window.addEventListener("resize", ()=>{ if ($("scr-q").classList.contains("on")) layoutZones(QS[idx]); });

/* ── 结果：先引导页，再揭晓轮播 ── */
let lastR = 0;
function finish(){
  const vals = [score.A, score.B, score.C, score.D], mx = Math.max(...vals), mn = Math.min(...vals);
  let r;
  if (score.D >= 4 && score.B >= 2 && score.D > score.B) r = 5;        // 东方雅韵
  else if (mx - mn <= 1 && mx <= 3) r = 4;                             // 艺术表达（均匀混搭）
  else if (score.A >= score.B && score.A >= score.C && score.A >= score.D) r = 0;
  else if (score.B >= score.C && score.B >= score.D) r = 1;
  else if (score.C >= score.D) r = 2;
  else r = 3;
  lastR = r;
  show("scr-r0");                                                      // 10.png「测试结果」引导页
  window.scrollTo(0,0);
}
$("btn-reveal").addEventListener("click", showResult);

function showResult(){
  const r = lastR;
  const car = $("carousel");
  car.innerHTML = RESULTS.map(s=>`<div class="slide"><img src="${s}" alt="结果"></div>`).join("");
  $("dots").innerHTML = RESULTS.map((_,i)=>`<i class="${i===r?"on":""}"></i>`).join("");
  $("r-which").textContent = "第 " + (r+1) + " 种";
  $("r-hint").innerHTML = `你的结果是 <b>${RNAME[r]}</b> · 左右滑动看全部 6 种`;
  show("scr-r");
  requestAnimationFrame(()=>{
    car.scrollLeft = r * car.clientWidth;                              // 定位到判定结果
    updateDots();
  });
  car.onscroll = updateDots;
  function updateDots(){
    const i = Math.round(car.scrollLeft / car.clientWidth);
    $("r-which").textContent = i === r ? "★ 你的结果" : "第 " + (i+1) + " 种";
    document.querySelectorAll("#dots i").forEach((d,j)=>d.classList.toggle("on", j===i));
  }
}
$("ar-prev").addEventListener("click", ()=>{$("carousel").scrollBy({left:-$("carousel").clientWidth,behavior:"smooth"})});
$("ar-next").addEventListener("click", ()=>{$("carousel").scrollBy({left: $("carousel").clientWidth,behavior:"smooth"})});
$("btn-save").addEventListener("click", ()=>{
  const b = $("btn-save"); b.textContent = "长按或截屏保存 ✓";
  setTimeout(()=>b.textContent = "截屏保存", 1800);
});
</script>
</body>
</html>
